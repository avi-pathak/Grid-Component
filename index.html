<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>apgrid demo</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        padding: 16px;
      }
      #theGrid {
        height: 480px;
        width: 720px;
        border: 1px solid #ccc;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>apgrid demo</h1>
    <label>
      Selection mode:
      <select id="mode">
        <option value="None">None</option>
        <option value="Cell">Cell (single)</option>
        <option value="CellRange" selected>CellRange (multiple)</option>
        <option value="Row">Row</option>
        <option value="RowRange">RowRange</option>
        <option value="Column">Column</option>
        <option value="ColumnRange">ColumnRange</option>
      </select>
    </label>
    <button id="undo" disabled>Undo</button>
    <button id="redo" disabled>Redo</button>
    <p style="margin: 4px 0; color: #666; font-size: 13px">
      Double-click a cell to edit. Ctrl+Z / Ctrl+Y to undo / redo.
    </p>
    <div id="theGrid"></div>
  </body>
</html>
