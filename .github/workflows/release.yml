name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore(release): bump version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Bump patch version
        run: npm version patch --no-git-tag-version
      - name: Check if version is already published
        id: version_check
        run: |
          pkg_name=$(node -p "require('./package.json').name")
          pkg_version=$(node -p "require('./package.json').version")

          echo "Package: $pkg_name"
          echo "Version: $pkg_version"

          if npm view "$pkg_name@$pkg_version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "Version already published, skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version not found on npm, publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create version bump PR
        if: steps.version_check.outputs.should_publish == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/release-version-bump
          delete-branch: true
          commit-message: chore(release): bump version [skip ci]
          title: chore(release): bump version
          body: |
            Automated version bump after npm publish.
          add-paths: |
            package.json
            package-lock.json
